pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        // ParchmentMC
        maven {
            name = "ParchmentMC"
            url = 'https://maven.parchmentmc.org'
        }
        // NeoForge
        maven {
            name = "Neoforged"
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'better_carryon_maid'
